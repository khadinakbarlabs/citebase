name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install connector dependencies (full connector tests)
        if: matrix.python-version != '3.10'
        run: pip install "mcp>=2.3,<3" "pydantic>=2.7,<3" "uvicorn>=0.30,<1" httpx
      - name: Compile scripts
        run: python -m py_compile scripts/*.py connector/tools.py
      - name: Validate JSON manifests and Actor files
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json connector/prices.json .actor/*.json; do
            python -m json.tool "$f" > /dev/null
          done
      - name: Run tests
        env:
          CITEBASE_REQUIRE_CONNECTOR_DEPS: ${{ matrix.python-version != '3.10' && '1' || '0' }}
        run: python -m unittest discover tests -v
