name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install connector dependencies
        run: pip install -r connector/requirements.txt httpx
      - name: Compile scripts
        run: python -m py_compile scripts/*.py connector/tools.py
      - name: Validate JSON manifests and Actor files
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json connector/prices.json .actor/*.json; do
            python -m json.tool "$f" > /dev/null
          done
      - name: Run tests
        env:
          CITEBASE_REQUIRE_CONNECTOR_DEPS: "1"
        run: python -m unittest discover tests -v
